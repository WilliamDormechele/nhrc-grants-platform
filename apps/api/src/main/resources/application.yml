server:
  port: ${API_PORT:8080}

spring:
  application:
    name: nhrc-grants-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nhrc_grants}}
    username: ${POSTGRES_USER:nhrc_grants}
    password: ${POSTGRES_PASSWORD:change_me_locally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nhrc:
  environment: ${APP_ENV:development}
  auth:
    mode: ${AUTH_MODE:development}
