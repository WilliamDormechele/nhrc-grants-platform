server:
  port: ${API_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  application:
    name: nhrc-grants-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nhrc_grants}}
    username: ${POSTGRES_USER:nhrc_grants}
    password: ${POSTGRES_PASSWORD:change_me_locally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nhrc:
  environment: ${APP_ENV:development}
  auth:
    mode: ${AUTH_MODE:uat}
  discovery:
    enabled: ${OPPORTUNITY_DISCOVERY_ENABLED:true}
    cron: "${OPPORTUNITY_DISCOVERY_CRON:0 15 6 * * *}"
    zone: ${OPPORTUNITY_DISCOVERY_ZONE:UTC}

  ai:
    url: ${NHRC_AI_URL:http://ollama:11434}
    model: ${NHRC_AI_MODEL:qwen3.5:4b}
